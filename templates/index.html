<!DOCTYPE html>
<html>

<head>
    <title>Online Chess</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
            text-align: center;
        }

        header {
            padding: 20px;
            background: #111;
        }

        header h1 {
            margin: 0;
        }

        input {
            padding: 12px;
            margin: 5px;
            font-size: 16px;
            border-radius: 6px;
            border: none;
        }

        button {
            padding: 11px 18px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #555;
            color: white;
        }

        button:hover {
            opacity: 0.8;
        }

        .create {
            background: #388e3c;
        }

        .join {
            background: #1976d2;
        }

        .draw {
            background: #757575;
        }

        .resign {
            background: #c62828;
        }

        #gameInfo {
            margin: 15px;
        }

        #players {
            font-size: 20px;
            font-weight: bold;
        }

        #turn {
            font-size: 18px;
            color: #ffd54f;
        }

        #check {
            color: #ff5252;
            font-size: 20px;
            font-weight: bold;
        }

        #timers {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 15px;
        }

        .timer {
            background: #292929;
            border-radius: 8px;
            padding: 10px 25px;
            font-size: 20px;
        }

        #gameArea {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 25px;
            margin: 20px auto;
        }

        #board {
            width: 480px;
            height: 480px;

            display: grid;

            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);

            border: 5px solid #111;
        }

        .square {
            position: relative;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 42px;
            cursor: pointer;

            user-select: none;
        }

        .light {
            background: #f0d9b5;
        }

        .dark {
            background: #b58863;
        }

        .selected {
            outline: 4px solid yellow;
            outline-offset: -4px;
        }

        /* LEGAL MOVE */

        .possible::after {
            content: "";
            width: 16px;
            height: 16px;

            background: rgba(0, 0, 0, 0.35);

            border-radius: 50%;

            position: absolute;
        }

        /* CAPTURE MOVE */

        .capture {
            box-shadow: inset 0 0 0 5px rgba(200, 0, 0, 0.6);
        }

        #history {
            width: 230px;
            background: #292929;
            border-radius: 8px;
            padding: 15px;
        }

        #moves {
            max-height: 420px;
            overflow-y: auto;
        }

        .move-row {
            padding: 7px;
            border-bottom: 1px solid #444;
        }

        #captured {
            font-size: 20px;
        }

        #controls {
            margin: 20px;
        }

        #gameOverBox {
            display: none;

            width: 320px;
            margin: 30px auto;
            padding: 25px;

            background: #292929;
            border-radius: 10px;

            box-shadow: 0 5px 20px black;
        }

        #gameOverBox h2 {
            color: #ffd700;
        }

        #resultText {
            font-size: 20px;
        }

        footer {
            padding: 20px;
            color: #777;
        }

        @media (max-width: 800px) {

            #gameArea {
                flex-direction: column;
                align-items: center;
            }

            #board {
                width: 92vw;
                height: 92vw;
            }

            .square {
                font-size: 8vw;
            }

            #history {
                width: 90vw;
            }
        }
    </style>
</head>


<body>

<header>
    <h1>♟ Online Chess</h1>
    <p>Play chess with your friend online</p>
</header>


<div id="lobby">

    <input
        id="playerName"
        placeholder="Your Name"
    >

    <input
        id="gameId"
        placeholder="Game ID"
    >

    <br>

    <button
        class="create"
        onclick="createGame()"
    >
        Create Game
    </button>

    <button
        class="join"
        onclick="joinGame()"
    >
        Join Game
    </button>

</div>


<div id="gameInfo">

    <p id="message"></p>

    <p id="players"></p>

    <p id="turn">
        Waiting for game...
    </p>

    <p id="check"></p>

</div>


<div id="timers">

    <div class="timer">
        ♔ White:
        <span id="whiteTimer">05:00</span>
    </div>

    <div class="timer">
        ♚ Black:
        <span id="blackTimer">05:00</span>
    </div>

</div>


<p id="captured">
    Captured:
</p>


<div id="gameArea">

    <div id="board"></div>

    <div id="history">

        <h2>📜 Move History</h2>

        <div id="moves">
            No moves yet
        </div>

    </div>

</div>


<div id="controls">

    <button
        class="draw"
        onclick="offerDraw()"
    >
        🤝 Offer Draw
    </button>

    <button
        class="resign"
        onclick="resignGame()"
    >
        🏳 Resign
    </button>

    <button onclick="location.reload()">
        🔄 New Game
    </button>

</div>


<div id="gameOverBox">

    <h2>GAME OVER</h2>

    <p id="resultText"></p>

    <button onclick="location.reload()">
        Play Again
    </button>

    <button onclick="goHome()">
        Return Home
    </button>

</div>


<footer>
    Online Chess Game
</footer>


<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>


<script>

const socket = io();

const game = new Chess();


const board =
    document.getElementById("board");

const turnText =
    document.getElementById("turn");

const message =
    document.getElementById("message");

const playersText =
    document.getElementById("players");

const checkText =
    document.getElementById("check");

const capturedText =
    document.getElementById("captured");

const movesElement =
    document.getElementById("moves");

const whiteTimer =
    document.getElementById("whiteTimer");

const blackTimer =
    document.getElementById("blackTimer");

const gameOverBox =
    document.getElementById("gameOverBox");

const resultText =
    document.getElementById("resultText");


let gameId = "";

let myColor = "";

let selectedSquare = null;

let possibleMoves = [];

let capturedPieces = [];

let moveHistory = [];

let whiteTime = 300;

let blackTime = 300;

let timerStarted = false;

let gameOver = false;


const pieces = {

    w: {
        k: "♔",
        q: "♕",
        r: "♖",
        b: "♗",
        n: "♘",
        p: "♙"
    },

    b: {
        k: "♚",
        q: "♛",
        r: "♜",
        b: "♝",
        n: "♞",
        p: "♟"
    }

};


/* CREATE GAME */

function createGame() {

    const name =
        document.getElementById("playerName").value.trim();

    if (name === "") {
        alert("Enter your name");
        return;
    }

    socket.emit("create_game", name);
}


/* JOIN GAME */

function joinGame() {

    const name =
        document.getElementById("playerName").value.trim();

    const id =
        document.getElementById("gameId").value.trim();

    if (name === "") {
        alert("Enter your name");
        return;
    }

    if (id === "") {
        alert("Enter Game ID");
        return;
    }

    gameId = id.toUpperCase();

    socket.emit("join_game", {
        game_id: gameId,
        name: name
    });
}


/* GAME CREATED */

socket.on("game_created", function(data) {

    gameId = data.game_id;

    myColor = data.color;

    message.textContent =
        "Game ID: " + gameId +
        " | Share this ID";

    playersText.textContent =
        data.name + " (White)";

    turnText.textContent =
        "Waiting for Black player...";

});


/* GAME JOINED */

socket.on("game_joined", function(data) {

    myColor = data.color;

});


/* PLAYERS READY */

socket.on("players_ready", function(data) {

    playersText.textContent =
        data.white +
        "  VS  " +
        data.black;

    message.textContent =
        "Game Started!";

    updateTurn();

    startTimer();

});


/* ERROR */

socket.on("error_message", function(msg) {

    alert(msg);

});


/* DRAW BOARD */

function drawBoard() {

    board.innerHTML = "";

    const position = game.board();


    for (let row = 0; row < 8; row++) {

        for (let col = 0; col < 8; col++) {

            const square =
                document.createElement("div");

            square.classList.add("square");


            if ((row + col) % 2 === 0) {

                square.classList.add("light");

            } else {

                square.classList.add("dark");

            }


            const piece =
                position[row][col];


            if (piece) {

                square.textContent =
                    pieces[piece.color][piece.type];

            }


            const file =
                String.fromCharCode(97 + col);

            const rank =
                8 - row;

            const squareName =
                file + rank;


            square.dataset.square =
                squareName;


            /*
             * SELECTED SQUARE
             */

            if (
                selectedSquare === squareName
            ) {

                square.classList.add(
                    "selected"
                );

            }


            /*
             * LEGAL MOVES
             */

            const legalMove =
                possibleMoves.find(
                    move =>
                        move.to === squareName
                );


            if (legalMove) {

                if (piece) {

                    square.classList.add(
                        "capture"
                    );

                } else {

                    square.classList.add(
                        "possible"
                    );

                }

            }


            square.onclick =
                function() {

                    movePiece(squareName);

                };


            board.appendChild(square);

        }

    }


    updateCheck();

}


/* MOVE */

function movePiece(square) {

    if (gameOver) {
        return;
    }


    if (myColor === "") {

        alert(
            "Create or join a game first"
        );

        return;
    }


    if (
        (
            myColor === "white" &&
            game.turn() !== "w"
        )
        ||
        (
            myColor === "black" &&
            game.turn() !== "b"
        )
    ) {

        return;
    }


    /*
     * FIRST CLICK
     * SELECT PIECE
     */

    if (selectedSquare === null) {

        const piece =
            game.get(square);


        if (!piece) {
            return;
        }


        if (
            (
                myColor === "white" &&
                piece.color !== "w"
            )
            ||
            (
                myColor === "black" &&
                piece.color !== "b"
            )
        ) {

            return;
        }


        selectedSquare = square;


        /*
         * GET LEGAL MOVES
         */

        possibleMoves =
            game.moves({
                square: square,
                verbose: true
            });


        drawBoard();

        return;
    }


    /*
     * SECOND CLICK
     * MAKE MOVE
     */

    const move =
        game.move({

            from: selectedSquare,

            to: square,

            promotion: "q"

        });


    /*
     * INVALID MOVE
     */

    if (move === null) {

        /*
         * If user clicked
         * another own piece,
         * select that piece.
         */

        const piece =
            game.get(square);


        if (
            piece &&
            (
                (
                    myColor === "white" &&
                    piece.color === "w"
                )
                ||
                (
                    myColor === "black" &&
                    piece.color === "b"
                )
            )
        ) {

            selectedSquare = square;

            possibleMoves =
                game.moves({
                    square: square,
                    verbose: true
                });

            drawBoard();

            return;
        }


        selectedSquare = null;

        possibleMoves = [];

        drawBoard();

        return;
    }


    /*
     * CAPTURE
     */

    if (move.captured) {

        capturedPieces.push(
            move.captured
        );

        updateCaptured();

    }


    selectedSquare = null;

    possibleMoves = [];


    /*
     * HISTORY
     */

    moveHistory.push(move.san);

    updateMoveHistory();


    drawBoard();

    updateTurn();


    /*
     * SEND MOVE
     */

    socket.emit("move", {

        game_id: gameId,

        move: move.san

    });


    checkGameEnd();

}


/* OPPONENT MOVE */

socket.on("opponent_move", function(move) {

    const result =
        game.move(move);


    if (
        result &&
        result.captured
    ) {

        capturedPieces.push(
            result.captured
        );

        updateCaptured();

    }


    moveHistory.push(move);

    updateMoveHistory();

    drawBoard();

    updateTurn();

    checkGameEnd();

});


/* TURN */

function updateTurn() {

    if (game.turn() === "w") {

        turnText.textContent =
            "♔ White's Turn";

    } else {

        turnText.textContent =
            "♚ Black's Turn";

    }

}


/* CHECK */

function updateCheck() {

    if (game.in_check()) {

        checkText.textContent =
            "⚠ CHECK!";

    } else {

        checkText.textContent =
            "";

    }

}


/* CAPTURED */

function updateCaptured() {

    let text =
        "Captured: ";


    capturedPieces.forEach(function(piece) {

        if (piece === "p")
            text += "♟ ";

        else if (piece === "n")
            text += "♞ ";

        else if (piece === "b")
            text += "♝ ";

        else if (piece === "r")
            text += "♜ ";

        else if (piece === "q")
            text += "♛ ";

    });


    capturedText.textContent =
        text;

}


/* MOVE HISTORY */

function updateMoveHistory() {

    if (moveHistory.length === 0) {

        movesElement.textContent =
            "No moves yet";

        return;
    }


    movesElement.innerHTML = "";


    for (
        let i = 0;
        i < moveHistory.length;
        i += 2
    ) {

        const row =
            document.createElement("div");


        row.classList.add(
            "move-row"
        );


        const moveNumber =
            Math.floor(i / 2) + 1;


        let text =
            moveNumber +
            ". " +
            moveHistory[i];


        if (moveHistory[i + 1]) {

            text +=
                " " +
                moveHistory[i + 1];

        }


        row.textContent =
            text;


        movesElement.appendChild(row);

    }

}


/* GAME END */

function checkGameEnd() {

    if (game.isCheckmate()) {

        const winner =
            game.turn() === "w"
            ? "Black"
            : "White";


        showGameOver(
            winner +
            " Wins - Checkmate!"
        );

    }

    else if (game.isStalemate()) {

        showGameOver(
            "Game Drawn - Stalemate"
        );

    }

    else if (game.isDraw()) {

        showGameOver(
            "Game Drawn!"
        );

    }

}


/* GAME OVER */

function showGameOver(result) {

    if (gameOver) {
        return;
    }


    gameOver = true;


    resultText.textContent =
        result;


    gameOverBox.style.display =
        "block";


    message.textContent =
        "Game Over";

}


/* HOME */

function goHome() {

    location.reload();

}


/* RESIGN */

function resignGame() {

    if (
        myColor === "" ||
        gameOver
    ) {

        return;
    }


    socket.emit("resign", {

        game_id: gameId,

        color: myColor

    });

}


/* RESIGN RESULT */

socket.on("game_resigned", function(winner) {

    showGameOver(
        winner +
        " Wins - Opponent Resigned!"
    );

});


/* OFFER DRAW */

function offerDraw() {

    if (myColor === "") {

        alert("Join a game first");

        return;
    }


    if (gameOver) {
        return;
    }


    socket.emit("offer_draw", {

        game_id: gameId

    });


    message.textContent =
        "Draw offer sent.";

}


/* DRAW OFFER */

socket.on("draw_offer", function() {

    if (gameOver) {
        return;
    }


    const accept =
        confirm(
            "Your opponent offered a draw.\n\n" +
            "OK = Accept\n" +
            "Cancel = Reject"
        );


    socket.emit("draw_response", {

        game_id: gameId,

        accepted: accept

    });

});


/* DRAW ACCEPTED */

socket.on("draw_accepted", function() {

    showGameOver(
        "Game Drawn - Agreement"
    );

});


/* DRAW REJECTED */

socket.on("draw_rejected", function() {

    message.textContent =
        "Draw offer rejected.";

});


/* TIMER */

function startTimer() {

    if (timerStarted) {
        return;
    }


    timerStarted = true;


    setInterval(function() {

        if (gameOver) {
            return;
        }


        if (game.turn() === "w") {

            whiteTime--;

        } else {

            blackTime--;

        }


        updateTimers();


        if (whiteTime <= 0) {

            showGameOver(
                "Black Wins - White ran out of time!"
            );

        }


        if (blackTime <= 0) {

            showGameOver(
                "White Wins - Black ran out of time!"
            );

        }

    }, 1000);

}


/* TIMER DISPLAY */

function updateTimers() {

    whiteTimer.textContent =
        formatTime(whiteTime);

    blackTimer.textContent =
        formatTime(blackTime);

}


/* FORMAT TIME */

function formatTime(seconds) {

    if (seconds < 0) {
        seconds = 0;
    }


    const minutes =
        Math.floor(seconds / 60);


    const remaining =
        seconds % 60;


    return (
        String(minutes).padStart(2, "0")
        +
        ":"
        +
        String(remaining).padStart(2, "0")
    );

}


/* INITIAL */

drawBoard();

updateTimers();

</script>

</body>

</html>
