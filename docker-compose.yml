version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: game_web_app_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: game_web_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: game_web_app_backend
    restart: always
    environment:
      - DATABASE_PROVIDER=postgres
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/game_web_app
      - MONGODB_URL=mongodb://localhost:27017
      - MONGODB_DATABASE=game_web_app
      - SECRET_KEY=super-secret-production-key-change-me
      - FRONTEND_URL=http://localhost
      - PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: game_web_app_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
